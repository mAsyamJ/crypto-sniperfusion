name: harness-validation

on:
  push:
    paths:
      - "harness/**"
      - ".github/workflows/harness-validation.yml"
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness-validation.yml"

jobs:
  standalone-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n harness/scripts/*.sh
      - name: Evaluator unit tests
        run: python3 -m unittest discover -s harness/tests -v
      - name: Synthetic evaluation smoke
        run: python3 harness/scripts/evaluate_paper.py harness/fixtures/example_paper_trades.jsonl
      - name: Offline research syntax validation
        run: python3 -m compileall -q harness
      - name: Research lifecycle fixture schema check
        run: python3 harness/research_batch.py validate --events harness/fixtures/research/synthetic_lifecycle.jsonl
      - name: Three-cycle offline strategy experiment smoke
        env:
          LIVE_TRADING_ENABLED: "false"
        run: |
          python3 harness/research_cycle.py --events harness/fixtures/research/synthetic_lifecycle.jsonl --out /tmp/snf-research-cycles-ci.json --cycles 3
          python3 -c 'import json; x=json.load(open("/tmp/snf-research-cycles-ci.json")); assert x["promotable"] is False and x["total_trials_recorded"] == 99 and x["sealed_check_read_count"] == 1 and x["final_candidate"] in ["S%02d" % i for i in range(11)]'
      - name: Ten strategy surrogate CI smoke (no network/signing)
        env:
          LIVE_TRADING_ENABLED: "false"
        run: |
          python3 harness/research_batch.py batch --events harness/fixtures/research/synthetic_lifecycle.jsonl --out /tmp/snf-synthetic-batch-ci.json
          python3 harness/research_batch.py diagnose --report /tmp/snf-synthetic-batch-ci.json
          python3 -c 'import json; x=json.load(open("/tmp/snf-synthetic-batch-ci.json")); assert x["promotable"] is False and len(x["results"]) == 11'
