name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2" # CI runners are RAM-constrained too

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the history-aware secret scan

      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1

      - name: Install cargo-deny (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate lockfile if absent
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default features, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features incl. live gates, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (default features)
        run: cargo test --workspace

      - name: Tests (all features)
        run: cargo test --workspace --all-features

      # H0.4: dependency vulnerabilities + licenses via cargo-deny
      # (policy: deny.toml — advisories denied, yanked denied, license
      # allowlist, unknown registries/git sources denied).
      - name: cargo-deny (advisories + licenses + sources)
        run: cargo deny check advisories licenses sources

      # H0.4: history-aware secret scan — every line ever ADDED on any
      # branch reachable from refs/remotes/origin and HEAD. The allowlist
      # markers mirror the working-tree scan (tests use `safe-secret-scan`);
      # audited exact-substring exemptions live in .github/secret-allowlist.txt
      # (each entry must reference a benign fixture and is itself reviewable).
      - name: Secret scan (full history, all added lines)
        run: |
          set -o pipefail
          if git log --all --diff-filter=A --format=%H -1 > /dev/null 2>&1; then
            git log -p --all --format=commit-%H \
              | grep -E "^[+]" \
              | grep -inE "(PRIVATE_KEY|SECRET|API_KEY|PASSWORD|PASSPHRASE|MNEMONIC|SEED_PHRASE)[[:space:]]*[=:][[:space:]]*[A-Za-z0-9+/_-]{16,}" \
              | grep -viE "YOUR_|placeholder|example|\.\.\.|REDACTED|safe-secret-scan|magic|\[SKIP\]" \
              | grep -viFf .github/secret-allowlist.txt \
              | tee /tmp/secret_hits.txt \
              && { echo "::error::secrets found in history"; cat /tmp/secret_hits.txt; exit 1; } \
              || { HITS=$(wc -l < /tmp/secret_hits.txt 2>/dev/null || echo 0); echo "history secret scan: clean"; }
          fi

      # H0.4: no funded key material in ANY commit, ever (file-path audit).
      - name: Key-file scan (full history, added paths)
        run: |
          if git log --all --diff-filter=A --name-only --format= \
              | grep -E "(^|/)(\.env($|\.)|.*\.key$|.*\.pem$|id\.json$|.*wallet.*\.json$|\.secrets/)" \
              | grep -v ".env.example"; then
            echo "::error::key material found in history"; exit 1
          fi
          echo "key-file scan: clean"

      # H0.4: upstream-source license guard (our own crates must not embed
      # incompatible-license upstream text; cargo-deny covers dependencies).
      - name: Upstream license text guard (crates/)
        run: |
          ! grep -rn "Microsoft Public License\|Ms-PL\|GNU GENERAL PUBLIC" crates/ 2>/dev/null
          echo "license scan: clean"
