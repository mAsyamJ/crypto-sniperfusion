[package]
name = "sniper-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Read-only projection of SniperFusion's own write-once artifacts.
# No network, no clocks in import logic (built_at is injected), no signer
# surface: this crate may never depend on sniper-runtime (ADR-0013, T-SEC5).

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
sniper-strategy.workspace = true

[dev-dependencies]
tempfile.workspace = true
