[package]
name = "sniper-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe runtimes (observe/replay/paper), priority bus, transaction journal, live capability gates"

[dependencies]
sniper-core.workspace = true
sniper-protocols.workspace = true
solana-client.workspace = true
solana-pubsub-client.workspace = true
solana-rpc-client-types.workspace = true
solana-sdk.workspace = true
yellowstone-grpc-client.workspace = true
yellowstone-grpc-proto.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
# The ONLY feature that compiles live-capability acquisition code. Even with
# it, four independent runtime gates must pass (see capability.rs).
live = []

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
yellowstone-grpc-client = { workspace = true, features = ["test-tools"] }
tokio = { workspace = true, features = ["test-util"] }
