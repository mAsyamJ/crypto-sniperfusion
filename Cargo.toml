[workspace]
resolver = "2"
members = [
    "crates/sniper-core",
    "crates/sniper-protocols",
    "crates/sniper-runtime",
    "crates/sniper-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "UNLICENSED"

[workspace.dependencies]
# internal
sniper-core = { path = "crates/sniper-core" }
sniper-protocols = { path = "crates/sniper-protocols" }
sniper-runtime = { path = "crates/sniper-runtime" }
# Solana generation pinned by ADR-0003 (M0 spike evidence: docs/SOLANA_COMPATIBILITY.md)
solana-sdk = "=2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
tempfile = "3"

# RAM-constrained host (7.6 GiB total): cap parallel codegen (AGENTS.md).
[profile.dev]
debug = 0
[profile.test]
debug = 0
